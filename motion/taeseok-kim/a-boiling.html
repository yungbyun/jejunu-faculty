<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taeseok Kim — A · Boiling limit</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04080e;display:grid;place-items:center;min-height:100vh}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
/* 시안 A — 끓음에는 한계가 있다.
 * 가열면에서 기포가 돋고, 빽빽해져 증기막이 덮이면 벽이 달아오른다(임계열유속).
 * 그 한계를 자료와 상관식을 함께 배운 신경망으로 미리 짚는다. */
const g = mgInit(document.getElementById('c'));
ACC = '#4db7ff';
window.CARD = {
  name: 'TAESEOK KIM', role: 'Assistant Professor',
  dept: 'Nuclear & Energy Engineering', org: 'Jeju National University',
  lab: 'THLAB', labFull: 'Thermal-Hydraulics Laboratory · 제주대학교 열수력 연구실',
  url: 'sites.google.com/view/taeseok-kim',
};
const BG = { c0: '#0d1c2b', c1: '#07121d', c2: '#04080e' };
const T = { w1: .1, boil: 1.4, w2: 2.6, crisis: 5.2, w3: 5.6, chf: 8.0, w4: 8.4, card: 11.4 };
const R = rng(884412);
const HOT = '#ff7a3c';

/* ---------- 가열면과 기포 ---------- */
const WALLX = 300, WALLW = 480, WTOP = 430, WBOT = 1500;
const BUB = Array.from({ length: 150 }, () => ({
  x: R(), y0: R(), ph: R(), v: .25 + R() * .45, r: 5 + R() * 13, wob: R() * 7, late: R(),
}));
function wall(t) {
  const a = clamp(inv(t, T.boil - .5, T.boil + .2)) * (1 - inv(t, T.chf - .2, T.chf + .5));
  if (a <= .01) return;
  const crisis = clamp(inv(t, T.crisis, T.crisis + 1.9));     // 증기막이 덮이는 정도
  g.save(); g.globalAlpha = a;
  /* 환형관 — 바깥벽과 안쪽 가열봉 */
  g.strokeStyle = 'rgba(140,190,230,.45)'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(WALLX - 90, WTOP - 30, WALLW + 180, WBOT - WTOP + 60, 26); g.stroke();
  /* 가열봉 */
  const grd = g.createLinearGradient(WALLX, 0, WALLX + WALLW, 0);
  grd.addColorStop(0, `rgba(${Math.round(90 + 165 * crisis)},${Math.round(60 + 40 * crisis)},40,.55)`);
  grd.addColorStop(.5, `rgba(${Math.round(150 + 105 * crisis)},${Math.round(90 + 40 * crisis)},50,.85)`);
  grd.addColorStop(1, `rgba(${Math.round(90 + 165 * crisis)},${Math.round(60 + 40 * crisis)},40,.55)`);
  g.fillStyle = grd;
  g.beginPath(); g.roundRect(WALLX, WTOP, WALLW, WBOT - WTOP, 18); g.fill();
  g.save(); g.shadowColor = `rgba(255,120,60,${.25 + .6 * crisis})`; g.shadowBlur = 40 + 70 * crisis;
  g.strokeStyle = `rgba(255,150,80,${.35 + .5 * crisis})`; g.lineWidth = 3;
  g.beginPath(); g.roundRect(WALLX, WTOP, WALLW, WBOT - WTOP, 18); g.stroke(); g.restore();

  /* 기포 — 벽에서 돋아 떠오른다. 한계에 가까울수록 수가 늘고 서로 붙는다 */
  const dens = lerp(.34, 1, clamp(inv(t, T.boil, T.crisis + 1.4)));
  for (let i = 0; i < BUB.length; i++) {
    const b = BUB[i];
    if (b.late > dens) continue;
    const p = ((t - T.boil) * b.v + b.ph) % 1;
    const side = b.x < .5 ? 0 : 1;
    const base = side ? WALLX + WALLW : WALLX;
    const off = (side ? 1 : -1) * (8 + outCubic(p) * (26 + 52 * (b.x % .5) * 2));
    const x = base + off + Math.sin(t * 2.2 + b.wob) * 5;
    const y = lerp(WBOT - 30, WTOP + 20, p) + Math.sin(t * 1.3 + b.wob) * 8;
    const rr = b.r * (.45 + .55 * outCubic(Math.min(1, p * 2.2))) * (1 + .5 * crisis);
    g.save();
    g.globalAlpha = a * (.75 - .25 * p) * (1 - crisis * .25);
    const bg2 = g.createRadialGradient(x - rr * .3, y - rr * .3, rr * .1, x, y, rr);
    bg2.addColorStop(0, 'rgba(255,255,255,.95)'); bg2.addColorStop(1, 'rgba(150,205,255,.35)');
    g.fillStyle = bg2;
    g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
    g.restore();
  }
  /* 증기막 */
  if (crisis > .02) {
    g.save(); g.globalAlpha = a * crisis * .55;
    for (const s of [0, 1]) {
      const x = s ? WALLX + WALLW : WALLX;
      const w = (s ? 1 : -1) * 34;
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.beginPath();
      g.moveTo(x, WTOP);
      for (let y = WTOP; y <= WBOT; y += 26) g.lineTo(x + w * (.6 + .4 * Math.sin(y * .03 + t * 5)), y);
      g.lineTo(x, WBOT); g.closePath(); g.fill();
    }
    g.restore();
  }
  g.restore();
}

/* ---------- 임계열유속 그래프 ---------- */
function chf(t) {
  const a = clamp(inv(t, T.chf, T.chf + .5)) * (1 - inv(t, T.card - .45, T.card - .05));
  if (a <= .01) return;
  const X0 = 150, X1 = 930, Y0 = 1180, Y1 = 640;
  g.save(); g.globalAlpha = a;
  g.strokeStyle = 'rgba(160,190,215,.4)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(X0, Y1 - 40); g.lineTo(X0, Y0); g.lineTo(X1, Y0); g.stroke();
  text('QUALITY', X1, Y0 + 44, { size: 20, weight: 700, color: DIM, align: 'right', ls: 4 });
  g.save(); g.translate(X0 - 30, Y1 + 160); g.rotate(-Math.PI / 2);
  text('CRITICAL HEAT FLUX', 0, 0, { size: 20, weight: 700, color: DIM, ls: 4 }); g.restore();
  /* 실험점 */
  const RR = rng(5151);
  const f = x => Y0 - (Y0 - Y1) * (.92 * Math.exp(-2.6 * x) + .06);
  const n = 46, grow = clamp(inv(t, T.chf + .25, T.chf + 1.5));
  for (let i = 0; i < n; i++) {
    if (i / n > grow) break;
    const u = RR(), x = X0 + u * (X1 - X0 - 30);
    const y = f(u) + (RR() - .5) * 74;
    g.fillStyle = 'rgba(255,170,110,.85)';
    g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill();
  }
  /* 신경망이 그린 선 */
  const lk = clamp(inv(t, T.chf + 1.1, T.chf + 2.1));
  if (lk > .01) {
    g.strokeStyle = ACC; g.lineWidth = 5; g.lineCap = 'round';
    g.save(); g.shadowColor = 'rgba(77,183,255,.6)'; g.shadowBlur = 18;
    g.beginPath();
    for (let i = 0; i <= 100 * lk; i++) { const u = i / 100; const x = X0 + u * (X1 - X0 - 30);
      i ? g.lineTo(x, f(u)) : g.moveTo(x, f(u)); }
    g.stroke(); g.restore();
  }
  text('PHYSICS-INFORMED NEURAL NETWORK', 540, 1270, { size: 24, weight: 700, color: ACC, alpha: a * clamp(inv(t, T.chf + 1.4, T.chf + 1.9)), ls: 5 });
  g.restore();
}

let PHOTO = null;
function renderFrame(f) {
  const t = f / FPS;
  g.clearRect(0, 0, W, H);
  bg(t, BG);
  eyebrow(t, T.boil + .6, T.chf - .2, 'SUBCOOLED FLOW BOILING · VERTICAL ANNULUS');
  eyebrow(t, T.chf + .5, T.card - .3, 'AI-BASED CHF PREDICTION');
  wall(t);
  chf(t);
  caption(t, T.w1, 2.5, 'Water keeps a reactor cool —', 'by boiling.', { color: COOL, y: 1640 });
  caption(t, T.w2, 5.5, 'But boil it too hard', 'and the wall dries out.', { y: 1640 });
  caption(t, T.w3 + .3, 7.9, 'That limit has a name:', 'critical heat flux.', { color: HOT, y: 1640 });
  caption(t, T.w4 + .3, T.card - .1, 'We teach a network the data', 'and the physics — to find it first.', { y: 1640, size: 46 });
  endCard(t, T.card, PHOTO);
  tail(t);
}
window.renderFrame = renderFrame; window.NF = NF;
window.sceneReady = (async () => { PHOTO = await mgReady('photo.jpg'); renderFrame(0); return true; })();
window.sceneReady.then(mgPlay);
</script>
</body>
</html>
