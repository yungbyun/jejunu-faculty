<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaehyuk Kang — C · ARTLab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04080e;display:grid;place-items:center;min-height:100vh}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
/* 시안 C — ARTLab 세 기둥.
 * 알갱이가 모여 연구실 이름이 되고, 연구 갈래 셋을 차례로 보여 준다. */
const g = mgInit(document.getElementById('c'));
const T = { name: .15, p1: 2.6, p2: 5.5, p3: 8.4, card: 11.4 };
const R = rng(31415926);
const PILLAR = [
  { n: '01', t: 'EXPERIMENT', s: 'Sorption of hazardous radionuclides' },
  { n: '02', t: 'COMPUTATION', s: 'AIMD & DFT reaction mechanisms' },
  { n: '03', t: 'SOLIDIFICATION', s: 'Geopolymer waste forms' },
];

/* ---------- 이름을 이루는 알갱이 ---------- */
let DOTS = [];
function buildDots() {
  const o = document.createElement('canvas'); o.width = 1080; o.height = 320;
  const x = o.getContext('2d');
  x.fillStyle = '#fff';
  x.font = '900 190px Inter, "Segoe UI", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('ARTLab', 540, 165);
  const d = x.getImageData(0, 0, 1080, 320).data;
  for (let yy = 0; yy < 320; yy += 6) for (let xx = 0; xx < 1080; xx += 6) {
    if (d[(yy * 1080 + xx) * 4 + 3] > 140) {
      const ang = R() * 7, rad = 420 + R() * 900;
      DOTS.push({ tx: xx, ty: yy, sx: 540 + Math.cos(ang) * rad, sy: 165 + Math.sin(ang) * rad * .9, dl: R() * .45, c: R() < .28 });
    }
  }
}
function wordmark(t) {
  const out = clamp(inv(t, T.p1 - .55, T.p1 - .05));
  const base = 1 - out;
  if (base <= .01) return;
  const yTop = 560;
  g.save(); g.translate(0, yTop);
  for (const p of DOTS) {
    const k = outCubic(clamp(inv(t, T.name + p.dl, T.name + p.dl + .85)));
    if (k <= .002) continue;
    const x = lerp(p.sx, p.tx, k), y = lerp(p.sy, p.ty, k);
    const fade = (1 - clamp(inv(t, T.name + 1.05, T.name + 1.6)));      // 글자가 나오면 알갱이는 사라진다
    g.globalAlpha = base * k * (.25 + .75 * fade);
    g.fillStyle = p.c ? 'rgba(243,166,58,.95)' : 'rgba(120,235,205,.9)';
    g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill();
  }
  g.restore();
  const ta = clamp(inv(t, T.name + 1.0, T.name + 1.55)) * base;
  text('ARTLab', 540, 725, { size: 190, weight: 900, alpha: ta, ls: -2 });
  const sa = clamp(inv(t, T.name + 1.35, T.name + 1.9)) * base;
  const r = rise(t, T.name + 1.35, .5);
  text('Advanced Radioactive waste', 540, 820, { size: 38, weight: 600, color: DIM, alpha: sa, dy: r.dy });
  text('eco-Technology Laboratory', 540, 872, { size: 38, weight: 600, color: DIM, alpha: sa, dy: r.dy });
  const ja = clamp(inv(t, T.name + 1.7, T.name + 2.2)) * base;
  text('Jeju National University', 540, 960, { size: 30, weight: 500, color: ACC, alpha: ja, ls: 4 });
}

/* ---------- 갈래 그림 ---------- */
function iconSorption(t, k, cx, cy) {                 // 판 위에 이온이 내려앉는다
  g.save(); g.globalAlpha = k;
  g.strokeStyle = 'rgba(120,235,205,.85)'; g.lineWidth = 5; g.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const y = cy + 120 + i * 56;
    g.beginPath(); g.moveTo(cx - 250, y); g.lineTo(cx + 250, y); g.stroke();
  }
  for (let i = 0; i < 7; i++) {
    const ph = (t * .75 + i * .37) % 1;
    const x = cx - 220 + i * 74;
    const y = lerp(cy - 210, cy + 100, outCubic(Math.min(1, ph * 1.4)));
    const land = clamp((ph * 1.4 - .92) / .1);
    g.save();
    g.shadowColor = 'rgba(243,166,58,.9)'; g.shadowBlur = 16;
    g.fillStyle = `rgba(255,205,125,${.5 + .5 * (1 - land)})`;
    g.beginPath(); g.arc(x, y, 13 - land * 2, 0, 7); g.fill();
    g.restore();
  }
  g.restore();
}
function iconAtoms(t, k, cx, cy) {                    // 떨리는 원자 덩어리
  g.save(); g.globalAlpha = k;
  const P = [];
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2 + t * .35;
    P.push([cx + Math.cos(a) * 160 + Math.sin(t * 8 + i) * 3, cy + Math.sin(a) * 120 + Math.cos(t * 7 + i) * 3, i % 2 ? 22 : 29]);
  }
  P.push([cx + Math.sin(t * 9) * 3, cy + Math.cos(t * 8) * 3, 36]);
  g.strokeStyle = 'rgba(190,255,235,.28)'; g.lineWidth = 3;
  for (let i = 0; i < P.length - 1; i++) { g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[P.length - 1][0], P[P.length - 1][1]); g.stroke(); }
  P.forEach(([x, y, r], i) => {
    const col = i === P.length - 1 ? [243, 166, 58] : (i % 2 ? [128, 206, 255] : [86, 226, 190]);
    const grd = g.createRadialGradient(x - r * .35, y - r * .35, r * .15, x, y, r);
    grd.addColorStop(0, `rgba(${col[0] + 50},${col[1] + 40},${col[2] + 40},1)`);
    grd.addColorStop(1, `rgba(${col[0] * .55 | 0},${col[1] * .55 | 0},${col[2] * .55 | 0},1)`);
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  });
  g.restore();
}
function iconBlock(t, k, cx, cy) {                    // 그물이 자라 덩어리가 된다
  g.save(); g.globalAlpha = k;
  const n = 4, S = 78, ang = t * .5;
  const pts = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) {
    const x = (i - 1.5) * S, y = (j - 1.5) * S, z = (l - 1.5) * S;
    const c = Math.cos(ang), s = Math.sin(ang);
    const X = x * c + z * s, Z = -x * s + z * c, p = 700 / (700 - Z);
    pts.push([cx + X * p, cy + y * p, p, i, j, l]);
  }
  const at = (i, j, l) => pts[(i * n + j) * n + l];
  g.strokeStyle = 'rgba(120,235,205,.55)'; g.lineWidth = 2;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) {
    if (i + 1 < n) { const a = at(i, j, l), b = at(i + 1, j, l); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    if (j + 1 < n) { const a = at(i, j, l), b = at(i, j + 1, l); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    if (l + 1 < n) { const a = at(i, j, l), b = at(i, j, l + 1); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  }
  const RR = rng(4242);
  for (let q = 0; q < 10; q++) {
    const p = pts[Math.floor(RR() * pts.length)];
    g.save(); g.shadowColor = 'rgba(243,166,58,.9)'; g.shadowBlur = 14;
    g.fillStyle = 'rgba(255,205,125,.9)'; g.beginPath(); g.arc(p[0], p[1], 7 * p[2], 0, 7); g.fill(); g.restore();
  }
  g.restore();
}

function pillar(t, i) {
  const t0 = [T.p1, T.p2, T.p3][i], t1 = i === 2 ? T.card - .15 : [T.p2, T.p3][i];
  const a = clamp(inv(t, t0, t0 + .45)) * (1 - inv(t, t1 - .4, t1 - .05));
  if (a <= .01) return;
  const P = PILLAR[i], r = rise(t, t0, .5);
  g.save(); g.globalAlpha = a;
  text(P.n, 540, 500 + r.dy, { size: 150, weight: 900, color: 'rgba(120,235,205,.16)', ls: 6 });
  g.restore();
  g.save(); g.translate(540, 980); g.scale(1.42, 1.42); g.translate(-540, -980);
  [iconSorption, iconAtoms, iconBlock][i](t, a, 540, 980);
  g.restore();
  const r2 = rise(t, t0 + .14, .5);
  text(P.t, 540, 1360, { size: 62, weight: 900, alpha: a * r2.alpha, dy: r2.dy, ls: 3 });
  const r3 = rise(t, t0 + .26, .5);
  text(P.s, 540, 1424, { size: 36, weight: 500, color: DIM, alpha: a * r3.alpha, dy: r3.dy });
  /* 진행 눈금 */
  const ga = clamp(inv(t, T.p1, T.p1 + .4)) * (1 - inv(t, T.card - .5, T.card - .1));
  g.save(); g.globalAlpha = ga;
  for (let k = 0; k < 3; k++) {
    const on = k === i;
    g.fillStyle = on ? ACC : 'rgba(169,186,200,.35)';
    g.beginPath(); g.roundRect(540 - 58 + k * 44, 1500, on ? 30 : 16, 6, 3); g.fill();
  }
  g.restore();
}

let PHOTO = null;
function renderFrame(f) {
  const t = f / FPS;
  g.clearRect(0, 0, W, H);
  bg(t);
  wordmark(t);
  for (let i = 0; i < 3; i++) pillar(t, i);
  endCard(t, T.card, PHOTO);
  tail(t);
}
window.renderFrame = renderFrame; window.NF = NF;
window.sceneReady = (async () => { PHOTO = await mgReady('photo.jpg'); buildDots(); renderFrame(0); return true; })();
window.sceneReady.then(mgPlay);
</script>
</body>
</html>
