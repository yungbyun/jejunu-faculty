<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaehyuk Kang — A · Immobilize</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04080e;display:grid;place-items:center;min-height:100vh}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
/* 시안 A — 가둬 두기.
 * 떠돌던 방사성 핵종이 지오폴리머 그물 안에 갇혀 멈춘다. */
const g = mgInit(document.getElementById('c'));
const T = { w1: .1, w2: 2.5, grow: 3.0, w3: 5.8, water: 8.9, card: 11.4 };

/* ---------- 그물(고화체) ---------- */
const R = rng(5150302);
const NX = 6, NY = 8, NZ = 6, BX = .46, BY = .58, BZ = .46;
const NODE = [];
for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let k = 0; k < NZ; k++) {
  const u = NX > 1 ? i / (NX - 1) - .5 : 0, v = NY > 1 ? j / (NY - 1) - .5 : 0, w = NZ > 1 ? k / (NZ - 1) - .5 : 0;
  NODE.push({
    x: u * 2 * BX + (R() - .5) * .07, y: v * 2 * BY + (R() - .5) * .07, z: w * 2 * BZ + (R() - .5) * .07,
    i, j, k, d: Math.hypot(u * 1.5, v, w * 1.5) / .95,     // 가운데에서 먼 순서로 자란다
  });
}
const idx = (i, j, k) => (i * NY + j) * NZ + k;
const EDGE = [];
for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let k = 0; k < NZ; k++) {
  if (i + 1 < NX) EDGE.push([idx(i, j, k), idx(i + 1, j, k)]);
  if (j + 1 < NY) EDGE.push([idx(i, j, k), idx(i, j + 1, k)]);
  if (k + 1 < NZ) EDGE.push([idx(i, j, k), idx(i, j, k + 1)]);
}
/* 대각선 몇 개를 섞어 그물처럼 보이게 */
for (let i = 0; i + 1 < NX; i++) for (let j = 0; j + 1 < NY; j++) for (let k = 0; k < NZ; k++)
  if (R() < .22) EDGE.push([idx(i, j, k), idx(i + 1, j + 1, k)]);

/* ---------- 갇힐 핵종 ---------- */
const ION = Array.from({ length: 74 }, () => {
  const tx = (R() - .5) * 2 * BX * .92, ty = (R() - .5) * 2 * BY * .92, tz = (R() - .5) * 2 * BZ * .92;
  return { tx, ty, tz, ph: R() * 7, sp: .7 + R() * .9, amp: .10 + R() * .09,
           d: Math.hypot(tx / BX * .75, ty / BY, tz / BZ * .75) / 1.25, r: 4.4 + R() * 3.0 };
});

const SCALE = 880, CX = 540, CY = 930;
function proj(x, y, z, ang, scale = SCALE, cx = CX, cy = CY) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const X = x * c + z * s, Z = -x * s + z * c;
  const p = 3.4 / (3.4 - Z);                      // 앞에 온 것이 조금 커진다
  return [cx + X * scale * p, cy + y * scale * p, p, Z];
}

function lattice(t) {
  const build = inv(t, T.grow, T.grow + 4.6);
  const ang = Math.sin((t - T.grow) * .42) * .46 + .22;
  const out = clamp(inv(t, T.card - .4, T.card + .5));
  const fade = lerp(1, 0, out);
  if (fade <= .01) return;
  const scale = SCALE * lerp(1, .92, out);

  const P = NODE.map(n => proj(n.x, n.y, n.z, ang, scale));
  g.save();
  g.globalAlpha = fade;
  /* 줄 */
  g.lineCap = 'round';
  for (const [a, b] of EDGE) {
    const ka = clamp((build - NODE[a].d) / .22), kb = clamp((build - NODE[b].d) / .22);
    const k = Math.min(ka, kb);
    if (k <= .02) continue;
    const dep = (P[a][3] + P[b][3]) / 2;
    const near = clamp((dep + .6) / 1.2);
    g.strokeStyle = `rgba(118,226,196,${(.12 + .34 * near) * k})`;
    g.lineWidth = (.9 + 1.5 * near) * (scale / SCALE);
    g.beginPath();
    g.moveTo(lerp(P[a][0], P[b][0], (1 - k) / 2), lerp(P[a][1], P[b][1], (1 - k) / 2));
    g.lineTo(lerp(P[b][0], P[a][0], (1 - k) / 2), lerp(P[b][1], P[a][1], (1 - k) / 2));
    g.stroke();
  }
  /* 마디 */
  for (let n = 0; n < NODE.length; n++) {
    const k = clamp((build - NODE[n].d) / .22);
    if (k <= .02) continue;
    const [x, y, p, z] = P[n];
    const near = clamp((z + .6) / 1.2);
    g.fillStyle = `rgba(190,255,235,${(.25 + .5 * near) * k})`;
    g.beginPath(); g.arc(x, y, (1.6 + 2.2 * near) * p * k, 0, 7); g.fill();
  }
  /* 핵종 — 처음엔 떠돌다가, 제 자리의 그물이 굳으면 멈춘다 */
  for (const io of ION) {
    const lock = clamp((build - io.d) / .28);
    const free = 1 - inOutCubic(lock);
    const wob = Math.sin(t * io.sp * 2.1 + io.ph) * io.amp * free;
    const wob2 = Math.cos(t * io.sp * 1.7 + io.ph * 1.7) * io.amp * free;
    const spread = lerp(1.55, 1, inOutCubic(clamp(inv(t, T.w2, T.grow + .8))));   // 처음엔 더 널리 흩어져 있다
    const [x, y, p, z] = proj((io.tx + wob) * spread, (io.ty + wob2) * spread, io.tz + wob * .6, ang, scale);
    const near = clamp((z + .6) / 1.2);
    const rr = io.r * p * (1 + .25 * free);
    g.save();
    g.shadowColor = 'rgba(243,166,58,.95)'; g.shadowBlur = (14 + 10 * free) * p;
    g.fillStyle = `rgba(255,${Math.round(205 - 40 * (1 - near))},${Math.round(120 - 40 * (1 - near))},${.55 + .45 * near})`;
    g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
    g.restore();
  }
  g.restore();
}

/* ---------- 물 ---------- */
const WR = rng(99221);
const DROPS = Array.from({ length: 52 }, () => ({ x: WR(), ph: WR(), v: .5 + WR() * .8, len: 140 + WR() * 230 }));
function water(t) {
  const a = clamp(inv(t, T.water, T.water + .55)) * (1 - inv(t, T.card - .5, T.card - .05));
  if (a <= .01) return;
  g.save(); g.lineCap = 'round';
  for (const d of DROPS) {
    const p = ((t - T.water) * d.v + d.ph) % 1.25;
    if (p > 1.1) continue;
    const x = 150 + d.x * 780, y = lerp(260, 1660, p);
    const grd = g.createLinearGradient(x, y - d.len, x, y);
    grd.addColorStop(0, 'rgba(127,182,255,0)'); grd.addColorStop(1, `rgba(176,218,255,${.72 * a})`);
    g.strokeStyle = grd; g.lineWidth = 2.8;
    g.beginPath(); g.moveTo(x, y - d.len); g.lineTo(x, y); g.stroke();
  }
  g.restore();
}

let PHOTO = null;
function renderFrame(f) {
  const t = f / FPS;
  g.clearRect(0, 0, W, H);
  bg(t);
  eyebrow(t, T.grow + .8, T.card - .3, 'SOLIDIFICATION · IMMOBILIZATION');
  lattice(t);
  water(t);
  caption(t, T.w1, 2.45, 'Radioactive waste', 'doesn’t go away.', { color: WARN });
  caption(t, T.w2, 5.65, 'It has to be locked in —', 'and stay locked.');
  caption(t, T.w3, 8.8, 'Geopolymer waste forms', 'hold it in place.', { color: ACC });
  caption(t, T.water, T.card - .1, 'Then we measure', 'what still gets out.');
  endCard(t, T.card, PHOTO);
  tail(t);
}
window.renderFrame = renderFrame; window.NF = NF;
window.sceneReady = (async () => { PHOTO = await mgReady('photo.jpg'); renderFrame(0); return true; })();
window.sceneReady.then(mgPlay);
</script>
</body>
</html>
