<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaehyuk Kang — D · Question</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04080e;display:grid;place-items:center;min-height:100vh}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
/* 시안 D — 물음과 대답.
 * 큰 글씨로 묻고 답한 뒤, 실제로 낸 논문 석 줄로 받친다. */
const g = mgInit(document.getElementById('c'));
const T = { q1: .12, q2: 1.5, q3: 3.0, a1: 4.5, a2: 7.0, refs: 9.3, card: 11.5 };
const R = rng(60601);

/* ---------- 큰 글씨 ---------- */
function bigLine(t, a, b, s, o = {}) {
  const al = clamp(inv(t, a, a + .3)) * (1 - inv(t, b - .25, b));
  if (al <= .01) return;
  const k = outCubic(inv(t, a, a + .45));
  const y = (o.y || 900) + (1 - k) * 34;
  text(s, 540, y, { size: o.size || 96, weight: 900, color: o.color || INK, alpha: al, ls: o.ls || 0 });
}

/* ---------- 굳는 덩어리 (대답 1) ---------- */
function block(t) {
  const a = clamp(inv(t, T.a1 + .15, T.a1 + .7)) * (1 - inv(t, T.a2 + .5, T.a2 + 1.0));
  if (a <= .01) return;
  const grow = inOutCubic(clamp(inv(t, T.a1 + .2, T.a1 + 1.6)));
  const cx = 540, cy = 760, n = 4, S = 86, ang = t * .42;
  const pts = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) {
    const x = (i - 1.5) * S, y = (j - 1.5) * S, z = (l - 1.5) * S;
    const c = Math.cos(ang), s = Math.sin(ang);
    const X = x * c + z * s, Z = -x * s + z * c, p = 760 / (760 - Z);
    pts.push([cx + X * p * grow, cy + y * p * grow, p]);
  }
  const at = (i, j, l) => pts[(i * n + j) * n + l];
  g.save(); g.globalAlpha = a;
  g.strokeStyle = 'rgba(120,235,205,.5)'; g.lineWidth = 2.2;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let l = 0; l < n; l++) {
    if (i + 1 < n) { const p = at(i, j, l), q = at(i + 1, j, l); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
    if (j + 1 < n) { const p = at(i, j, l), q = at(i, j + 1, l); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
    if (l + 1 < n) { const p = at(i, j, l), q = at(i, j, l + 1); g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
  }
  const RR = rng(80808);
  for (let q = 0; q < 12; q++) {
    const p = pts[Math.floor(RR() * pts.length)];
    g.save(); g.shadowColor = 'rgba(243,166,58,.9)'; g.shadowBlur = 15;
    g.fillStyle = 'rgba(255,205,125,.92)'; g.beginPath(); g.arc(p[0], p[1], 7 * p[2], 0, 7); g.fill(); g.restore();
  }
  g.restore();
}

/* ---------- 새는지 재기 (대답 2) ---------- */
const DR = Array.from({ length: 26 }, () => ({ x: R(), ph: R(), v: .55 + R() * .75 }));
function leach(t) {
  const a = clamp(inv(t, T.a2 + .15, T.a2 + .7)) * (1 - inv(t, T.refs - .2, T.refs + .2));
  if (a <= .01) return;
  const cx = 540, cy = 780;
  g.save(); g.globalAlpha = a;
  /* 물에 잠긴 덩어리 */
  g.strokeStyle = 'rgba(120,235,205,.65)'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(cx - 150, cy - 130, 300, 260, 16); g.stroke();
  g.fillStyle = 'rgba(47,211,167,.10)'; g.fill();
  /* 물방울 */
  g.lineCap = 'round';
  for (const d of DR) {
    const p = ((t - T.a2) * d.v + d.ph) % 1.2;
    if (p > 1.05) continue;
    const x = cx - 230 + d.x * 460, y = lerp(cy - 330, cy + 300, p);
    const grd = g.createLinearGradient(x, y - 120, x, y);
    grd.addColorStop(0, 'rgba(127,182,255,0)'); grd.addColorStop(1, `rgba(170,214,255,${.6 * a})`);
    g.strokeStyle = grd; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(x, y - 120); g.lineTo(x, y); g.stroke();
  }
  /* 새어 나온 양 — 바늘이 거의 안 움직인다 */
  const v = .04 + .05 * (1 + Math.sin(t * 1.6)) / 2;
  g.strokeStyle = 'rgba(169,186,200,.45)'; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - 180, cy + 210); g.lineTo(cx + 180, cy + 210); g.stroke();
  g.strokeStyle = ACC; g.lineWidth = 10;
  g.beginPath(); g.moveTo(cx - 180, cy + 210); g.lineTo(cx - 180 + 360 * v, cy + 210); g.stroke();
  g.restore();
  text('LEACHED FRACTION', 540, cy + 268, { size: 22, weight: 700, color: DIM, alpha: a * .9, ls: 5 });
}

/* ---------- 논문 석 줄 ---------- */
const REFS = [
  ['Scenario-driven dose evaluation for spent fuel storage under a beyond-design-basis accident', 'Nuclear Technology · 2026'],
  ['Iodate sorption mechanism by CoAl LDH, via experiments and AIMD', 'Journal of Hazardous Materials · 2025'],
  ['Phosphate-based geopolymer waste form for spent ion exchange resins', 'Journal of Nuclear Materials · 2025'],
];
function refs(t) {
  const a = clamp(inv(t, T.refs, T.refs + .4)) * (1 - inv(t, T.card - .25, T.card + .05));
  if (a <= .01) return;
  text('PEER-REVIEWED, 2025–2026', 540, 600, { size: 24, weight: 700, color: ACC, alpha: a * .95, ls: 6 });
  let y = 720;
  REFS.forEach((r, i) => {
    const at = T.refs + .25 + i * .3;
    const k = clamp(inv(t, at, at + .45)), ri = rise(t, at, .45);
    const lines = wrap(r[0], 830, 33);
    if (k > .01) {
      g.save(); g.globalAlpha = a * k;
      g.strokeStyle = 'rgba(120,235,205,.35)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(125, y - 52 + ri.dy); g.lineTo(955, y - 52 + ri.dy); g.stroke();
      g.restore();
      lines.forEach((ln, j) => text(ln, 125, y + j * 42 + ri.dy, { size: 33, weight: 700, align: 'left', alpha: a * k }));
      text(r[1], 125, y + lines.length * 42 + 10 + ri.dy, { size: 28, weight: 500, color: DIM, align: 'left', alpha: a * k });
    }
    y += lines.length * 42 + 120;
  });
}

let PHOTO = null;
function renderFrame(f) {
  const t = f / FPS;
  g.clearRect(0, 0, W, H);
  bg(t);
  bigLine(t, T.q1, T.q2 + .05, 'Where does', { y: 880 });
  bigLine(t, T.q2, T.q3 + .05, 'radioactive waste', { y: 880, size: 86, color: WARN });
  bigLine(t, T.q3, T.a1 + .05, 'actually go?', { y: 880 });
  block(t);
  leach(t);
  caption(t, T.a1 + .35, T.a2 + .1, 'It gets locked', 'into a solid.', { y: 1300, color: ACC });
  caption(t, T.a2 + .35, T.refs - .1, 'Then we check', 'whether it stays there.', { y: 1300 });
  refs(t);
  endCard(t, T.card, PHOTO);
  tail(t);
}
window.renderFrame = renderFrame; window.NF = NF;
window.sceneReady = (async () => { PHOTO = await mgReady('photo.jpg'); renderFrame(0); return true; })();
window.sceneReady.then(mgPlay);
</script>
</body>
</html>
