<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaehyuk Kang — B · Sorption</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04080e;display:grid;place-items:center;min-height:100vh}canvas{display:block;width:1080px;height:1920px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
/* 시안 B — 붙잡기.
 * 물을 타고 흐르던 핵종이 층상 물질 사이에 붙잡히고, 원자 단위로 들여다본다. */
const g = mgInit(document.getElementById('c'));
const T = { w1: .1, layers: 2.4, w2: 2.6, zoom: 6.3, w3: 6.6, w4: 9.4, card: 11.4 };
const R = rng(770411);

/* ---------- 물살 ---------- */
const FLOW = Array.from({ length: 30 }, () => ({ y: .06 + R() * .88, ph: R(), v: .30 + R() * .36, len: 170 + R() * 280, w: .8 + R() * 1.5 }));
/* ---------- 흘러오는 이온 ---------- */
const IONS = Array.from({ length: 16 }, (_, i) => ({
  y0: .12 + R() * .78, ph: R(), v: .20 + R() * .22, r: 7 + R() * 4,
  slot: i % 5, lane: Math.floor(R() * 3) - 1, grab: .25 + R() * .55,
}));

/* ---------- 층상 물질 (LDH) ---------- */
const NL = 5, LW = 760, LH = 26, GAP = 74;
function layerShape(i, t) {
  const inAll = inOutCubic(inv(t, T.layers + i * .11, T.layers + i * .11 + .75));
  const cy = 980 + (i - (NL - 1) / 2) * GAP;
  const x0 = 540 - LW / 2 + (1 - inAll) * (i % 2 ? 620 : -620);
  return { x: x0, y: cy, a: inAll, skew: 46 };
}
function layers(t, zoomK) {
  const out = clamp(inv(t, T.card - .5, T.card + .3));
  const base = (1 - out) * (1 - clamp(zoomK * 1.35));
  if (base <= .01) return;
  const sc = lerp(1, 3.4, zoomK);
  g.save();
  g.translate(540, 980); g.scale(sc, sc); g.translate(-540, -980);
  g.globalAlpha = base;
  for (let i = 0; i < NL; i++) {
    const L = layerShape(i, t);
    if (L.a <= .01) continue;
    g.save(); g.globalAlpha = base * L.a;
    /* 판 — 위에서 비스듬히 본 평행사변형 */
    const grd = g.createLinearGradient(L.x, L.y - LH, L.x + LW, L.y + LH);
    grd.addColorStop(0, 'rgba(47,211,167,.30)'); grd.addColorStop(.5, 'rgba(120,230,200,.52)'); grd.addColorStop(1, 'rgba(47,211,167,.22)');
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(L.x, L.y); g.lineTo(L.x + LW, L.y - 14);
    g.lineTo(L.x + LW + L.skew, L.y - 14 + LH); g.lineTo(L.x + L.skew, L.y + LH);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(190,255,235,.55)'; g.lineWidth = 1.4; g.stroke();
    /* 판 위의 금속 자리 */
    g.fillStyle = 'rgba(225,255,246,.55)';
    for (let k = 0; k < 16; k++) {
      const u = (k + .5) / 16;
      g.beginPath(); g.arc(L.x + LW * u + L.skew * .5, L.y - 14 * u + LH * .5, 2.6, 0, 7); g.fill();
    }
    g.restore();
  }
  g.restore();
}

/* 층 사이로 붙잡히는 이온 */
function ions(t, zoomK) {
  const out = clamp(inv(t, T.card - .5, T.card + .3));
  const base = (1 - out) * (1 - clamp(zoomK * 1.35));
  if (base <= .01) return;
  const sc = lerp(1, 3.4, zoomK);
  g.save();
  g.translate(540, 980); g.scale(sc, sc); g.translate(-540, -980);
  for (const io of IONS) {
    const p = ((t - .2) * io.v + io.ph) % 1.6;
    const caught = clamp(inv(t, T.layers + .5 + io.grab, T.layers + 1.1 + io.grab));
    let x, y;
    if (caught < 1) {
      x = lerp(-80, 1160, Math.min(p, 1.05));
      y = io.y0 * 1700 + 140 + Math.sin(t * 1.6 + io.ph * 9) * 26;
      if (caught > 0) {                       // 붙잡히는 중 — 제 자리로 끌려간다
        const L = layerShape(io.slot % (NL - 1), t);
        const tx = L.x + 110 + io.slot * 128 + (io.lane + 1) * 44;
        const ty = L.y + GAP / 2 + 2;
        const k = inOutCubic(caught);
        x = lerp(x, tx, k); y = lerp(y, ty, k);
      }
    } else {
      const L = layerShape(io.slot % (NL - 1), t);
      x = L.x + 110 + io.slot * 128 + (io.lane + 1) * 44;
      y = L.y + GAP / 2 + 2;
    }
    const glow = lerp(1, .45, caught);
    g.save();
    g.globalAlpha = base;
    g.shadowColor = 'rgba(243,166,58,.95)'; g.shadowBlur = 16 * glow + 6;
    g.fillStyle = `rgba(255,208,130,${.65 + .35 * glow})`;
    g.beginPath(); g.arc(x, y, io.r, 0, 7); g.fill();
    g.restore();
  }
  g.restore();
}

function flow(t) {
  const a = clamp(inv(t, .1, .7)) * (1 - inv(t, T.layers + 1.4, T.layers + 2.4));
  if (a <= .01) return;
  g.save(); g.lineCap = 'round';
  for (const f of FLOW) {
    const p = ((t) * f.v + f.ph) % 1.3;
    const x = lerp(-260, 1340, p), y = f.y * 1700 + 140;
    const grd = g.createLinearGradient(x - f.len, y, x, y);
    grd.addColorStop(0, 'rgba(127,182,255,0)'); grd.addColorStop(1, `rgba(150,200,255,${.42 * a})`);
    g.strokeStyle = grd; g.lineWidth = f.w * 2.2;
    g.beginPath(); g.moveTo(x - f.len, y); g.lineTo(x, y); g.stroke();
  }
  g.restore();
}

/* ---------- 원자 단위 ---------- */
const AT = [];
(function build() {
  /* 아래쪽 판 — 금속·산소가 번갈아 */
  for (let i = 0; i < 9; i++) for (let j = 0; j < 2; j++) {
    AT.push({ x: -340 + i * 86 + j * 43, y: 150 + j * 74, r: j ? 19 : 25,
      c: j ? [128, 206, 255] : [86, 226, 190], k: 'host' });
  }
  /* 요오드산 — 가운데 I 하나에 O 셋 */
  AT.push({ x: 0, y: -120, r: 33, c: [243, 166, 58], k: 'i' });
  for (const [dx, dy] of [[-58, -48], [58, -48], [0, 58]]) AT.push({ x: dx, y: -120 + dy, r: 20, c: [255, 120, 96], k: 'o' });
})();
function atoms(t) {
  const a = clamp(inv(t, T.zoom + .15, T.zoom + .85)) * (1 - inv(t, T.card - .55, T.card - .05));
  if (a <= .01) return;
  const drop = inOutCubic(clamp(inv(t, T.zoom + .7, T.zoom + 2.1)));     // 요오드산이 판에 내려앉는다
  const cx = 540, cy = 930, S = lerp(1.25, 1, clamp(inv(t, T.zoom, T.zoom + .9)));
  g.save(); g.globalAlpha = a;
  g.translate(cx, cy); g.scale(S, S);
  /* 결합선 */
  g.strokeStyle = 'rgba(190,255,235,.30)'; g.lineWidth = 3;
  for (let i = 0; i < AT.length; i++) for (let j = i + 1; j < AT.length; j++) {
    const A = AT[i], B = AT[j];
    if (A.k === 'host' && B.k === 'host') {
      const d = Math.hypot(A.x - B.x, A.y - B.y);
      if (d < 95) { g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); }
    }
  }
  g.strokeStyle = 'rgba(255,190,120,.55)'; g.lineWidth = 4;
  const iAt = AT.find(x => x.k === 'i');
  const dy = lerp(-170, 0, drop);
  for (const o of AT.filter(x => x.k === 'o')) {
    g.beginPath(); g.moveTo(iAt.x, iAt.y + dy); g.lineTo(o.x, o.y + dy); g.stroke();
  }
  /* 공 */
  for (const at of AT) {
    const vib = Math.sin(t * 9 + at.x * .07 + at.y * .05) * 2.2;         // 늘 조금씩 떨린다 (AIMD)
    const yy = at.y + vib + (at.k === 'i' || at.k === 'o' ? dy : 0);
    const xx = at.x + Math.cos(t * 7.5 + at.y * .06) * 1.8;
    const grd = g.createRadialGradient(xx - at.r * .35, yy - at.r * .35, at.r * .15, xx, yy, at.r);
    grd.addColorStop(0, `rgba(${at.c[0] + 50},${at.c[1] + 40},${at.c[2] + 40},1)`);
    grd.addColorStop(1, `rgba(${at.c[0] * .55 | 0},${at.c[1] * .55 | 0},${at.c[2] * .55 | 0},1)`);
    g.fillStyle = grd;
    g.beginPath(); g.arc(xx, yy, at.r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.5; g.stroke();
  }
  g.restore();
  /* 꼬리표 */
  const la = clamp(inv(t, T.zoom + 1.1, T.zoom + 1.6)) * (1 - inv(t, T.card - .55, T.card - .15));
  text('AIMD  ·  DFT  ·  Bader charge', 540, 1300, { size: 26, weight: 700, color: ACC, alpha: la * .95, ls: 5 });
}

let PHOTO = null;
function renderFrame(f) {
  const t = f / FPS;
  const zoomK = inOutCubic(clamp(inv(t, T.zoom - .35, T.zoom + .75)));
  g.clearRect(0, 0, W, H);
  bg(t);
  eyebrow(t, T.layers + .7, T.zoom - .2, 'SORPTION · LAYERED MATERIALS');
  eyebrow(t, T.zoom + 1.0, T.card - .3, 'FIRST-PRINCIPLES SIMULATION');
  flow(t);
  layers(t, zoomK);
  ions(t, zoomK);
  atoms(t);
  caption(t, T.w1, 2.5, 'Some radionuclides', 'travel with the water.', { color: COOL });
  caption(t, T.w2 + .2, 6.2, 'Layered materials', 'catch them.', { color: ACC });
  caption(t, T.w3 + .5, 9.3, 'And we watch it happen', 'atom by atom.');
  caption(t, T.w4, T.card - .1, 'Why it sticks —', 'down to the charge.');
  endCard(t, T.card, PHOTO);
  tail(t);
}
window.renderFrame = renderFrame; window.NF = NF;
window.sceneReady = (async () => { PHOTO = await mgReady('photo.jpg'); renderFrame(0); return true; })();
window.sceneReady.then(mgPlay);
</script>
</body>
</html>
