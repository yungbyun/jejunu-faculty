<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="제주대 교수진">
<meta name="color-scheme" content="light dark">
<title>제주대학교 교수진 안내</title>
<meta name="description" content="제주대학교 공과대학 학과별 교수진 — 연구실, 연락처, 세부 전공과 최근 논문">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231b3a5c'/><text x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>J</text></svg>">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar__inner">
    <a href="#/" class="brand" aria-label="홈으로">
      <span class="brand__mark">J</span>
      <span class="brand__text">
        <strong>제주대학교 교수진</strong>
        <small>Faculty Directory · College of Engineering</small>
      </span>
    </a>
    <div class="topbar__tools">
      <label class="search" aria-label="검색">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="교수명 · 전공 키워드 검색" autocomplete="off">
      </label>
      <button id="refreshBtn" class="iconbtn" type="button" aria-label="데이터 새로 고침" title="Google 시트에서 최신 데이터 다시 불러오기">
        <svg class="ico-refresh" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="userBox" class="user" hidden></div>
      <button id="themeBtn" class="iconbtn" type="button" aria-label="테마 전환" title="라이트/다크 전환">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app" class="container" aria-live="polite"></main>

<footer class="foot">
  <div class="container foot__inner">
    <span id="dataStatus" class="foot__status">데이터 불러오는 중…</span>
    <span class="foot__sep">·</span>
    <span>세부 전공은 각 교수의 홈페이지 및 최근 논문(2023–2026)을 바탕으로 정리한 요약입니다.</span>
  </div>
</footer>

<div id="drawer" class="drawer" hidden>
  <div class="drawer__backdrop" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
</div>

<div id="gate" class="gate" hidden>
  <div class="gate__card">
    <span class="brand__mark gate__mark">J</span>
    <h1>제주대학교 교수진 안내</h1>
    <p>허용된 Google 계정으로 로그인하면 교수진 정보를 볼 수 있습니다.</p>
    <div class="gate__btn"></div>
    <div class="gate__msg" aria-live="polite"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
