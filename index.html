<header class="topbar">

      <a href="#/quiz" data-nav="quiz">퀴즈</a>

      <label class="search" aria-label="검색">

        <input id="q" type="search" placeholder="교수명 · 전공 키워드 검색" autocomplete="off">
      </label>
      <div id="userBox" class="user" hidden></div>
      <button id="themeBtn" class="iconbtn" type="button" aria-label="테마 전환" title="라이트/다크 전환">

        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>

<main id="app" class="container" aria-live="polite"></main>

<footer class="foot">
  <div class="container foot__inner">
    <span id="dataStatus" class="foot__status">데이터 불러오는 중…</span>
    <button type="button" id="footReload" class="foot__btn" title="최신 버전으로 다시 불러오기">새로고침</button>
    <span class="foot__sep">·</span>
    <span>세부 전공은 각 교수의 홈페이지 및 최근 논문(2023–2026)을 바탕으로 정리한 요약입니다.</span>
  </div>
</footer>

<div id="drawer" class="drawer" hidden>
  <div class="drawer__backdrop" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
</div>

<div id="gate" class="gate" hidden>
  <div class="gate__card">
    <span class="brand__mark gate__mark">CE</span>
    <h1>제주대학교 공과대학</h1>
    <p>허용된 Google 계정으로 로그인하면 교수진 정보를 볼 수 있습니다.</p>
    <div class="gate__btn"></div>
    <div class="gate__msg" aria-live="polite"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* 버전 확인 후 app.js 로드: version.json은 매번 새로 읽으므로(캐시 없음) 배포 직후에도 옛 코드가 남지 않습니다.
   읽지 못하면(오프라인 등) 아래 기본 버전으로 로드합니다. */
(async function () {
  var v = '20260918p';
  try { var r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) { var j = await r.json(); if (j && j.v) v = String(j.v); } } catch (e) {}
  var css = document.getElementById('cssMain');
  if (css && css.href.indexOf('v=' + v) < 0) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'styles.css?v=' + v; l.onload = function () { css.remove(); }; document.head.appendChild(l); }
  var s = document.createElement('script'); s.src = 'app.js?v=' + v; document.body.appendChild(s);
})();
</script>
